<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>Privacy Inspector</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <div class="site">
      <div class="name" id="site">—</div>
      <div class="meta" id="meta"></div>
    </div>
    <div class="score" id="scoreBox">
      <div class="grade" id="grade">?</div>
      <div class="points" id="points">—</div>
    </div>
  </header>

  <nav id="tabs">
    <button data-tab="summary" class="active">Resumo</button>
    <button data-tab="trackers">Rastreadores</button>
    <button data-tab="cookies">Cookies</button>
    <button data-tab="storage">Storage</button>
    <button data-tab="fingerprint">Fingerprint</button>
    <button data-tab="sync">Bounce/Sync</button>
    <button data-tab="hijack">Hijacking</button>
    <button data-tab="blocklist">Bloqueio</button>
  </nav>

  <main>
    <section id="tab-summary" class="tab active"></section>
    <section id="tab-trackers" class="tab"></section>
    <section id="tab-cookies" class="tab"></section>
    <section id="tab-storage" class="tab"></section>
    <section id="tab-fingerprint" class="tab"></section>
    <section id="tab-sync" class="tab"></section>
    <section id="tab-hijack" class="tab"></section>
    <section id="tab-blocklist" class="tab">
      <label class="toggle"><input type="checkbox" id="blockKnown"> Bloquear todos os rastreadores conhecidos da lista interna</label>
      <p class="hint">Um domínio por linha (ex.: <code>doubleclick.net</code>). Subdomínios são incluídos. Recarregue a página após salvar.</p>
      <textarea id="blocklist" rows="10" spellcheck="false"></textarea>
      <div class="row">
        <button id="saveBlocklist" class="primary">Salvar</button>
        <span id="saveStatus" class="hint"></span>
      </div>
    </section>
  </main>

  <footer>
    <button id="refresh">Atualizar</button>
    <button id="export">Exportar JSON</button>
    <button id="openTab">Abrir em aba</button>
    <span class="hint" id="footerHint"></span>
  </footer>
  <script src="../domain.js"></script>
  <script src="popup.js"></script>
</body>
</html>
